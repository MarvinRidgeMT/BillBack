<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBack demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, kind, confident — relief, not alarm
   IDEA: a hospital bill floating in a mint sky, stamped $0
   PICTURE: one large crumpled bill among drifting clouds and torn scraps of the bill
   COLOUR and TYPE: mint sky, forest ink, coral pop; Anton headlines, DM Sans body
   LAYOUT: poster hero that glides into one calm column of steps */
:root{color-scheme:light dark;
 --sky1:light-dark(#CFEFE0,#0D2C24);--sky2:light-dark(#EAF8F0,#13392F);--mint:light-dark(#BFE6D3,#174236);
 --ink:light-dark(#0E3B2E,#E6F6EE);--ink2:light-dark(#3D6457,#A9CDBE);--card:light-dark(#FFFFFF,#0F3027);
 --line:light-dark(#D6EBE0,#24524A);--coral:#FF6B4A;--oncoral:#3B0E04;--coralbg:light-dark(#FFE3DB,#4A1A10);--cloud:light-dark(#FFFFFF,#2A5A4D)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--ink);font:17px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.stage{position:relative;min-height:100vh;overflow:hidden}
.sky{position:absolute;inset:0;pointer-events:none}
.cloud{position:absolute;border-radius:50%;background:var(--cloud);filter:blur(1px);opacity:.92}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:60%;height:120%;left:12%;top:-55%}.cloud::after{width:45%;height:95%;right:10%;top:-35%}
@keyframes drift{from{transform:translateX(-8vw)}to{transform:translateX(8vw)}}
.scrap{position:absolute;filter:drop-shadow(0 10px 10px rgba(14,59,46,.18));opacity:.95}
.scrap svg{display:block;width:100%}
@keyframes tumble{from{transform:rotate(var(--r)) translateY(0)}to{transform:rotate(calc(var(--r) * -1 + 6deg)) translateY(-30px)}}
nav{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px max(5vw,16px)}
.logo{font-family:Anton,sans-serif;font-size:24px;letter-spacing:.03em;color:var(--ink)}
nav .links{display:flex;gap:22px;font-size:15px;color:var(--ink)}
nav a{color:inherit;text-decoration:none}
.hero{position:relative;z-index:2;padding:0 max(5vw,16px);height:calc(100vh - 80px);min-height:560px}
h1{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(64px,11vw,168px);line-height:.9;margin:2vh 0 0;color:var(--ink);letter-spacing:.005em;position:relative;z-index:1}
h1 .l2{display:block;padding-left:8vw}
.bill-wrap{position:absolute;z-index:3;left:70%;top:50%;width:clamp(220px,24vw,330px);aspect-ratio:.78;transform:translate(-40%,-50%)}
.bill{position:absolute;inset:0;border-radius:6px;background:linear-gradient(135deg,#FFFFFF 0%,#F4F6F2 48%,#FFFFFF 52%,#EEF1EC 100%);padding:8% 9%;font-family:ui-monospace,Menlo,monospace;color:#20302A;box-shadow:0 30px 50px -20px rgba(14,59,46,.45),0 8px 16px -8px rgba(14,59,46,.3);transform:rotate(-8deg)}
.bill svg.creases{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bill .h{font-size:clamp(11px,1vw,14px);font-weight:700;letter-spacing:.04em}
.bill .s{font-size:clamp(9px,.8vw,11px);color:#6B7A73;margin:2px 0 10%}
.bill .row{display:flex;justify-content:space-between;font-size:clamp(9px,.8vw,11px);color:#4C5B55;padding:3% 0;border-bottom:1px dashed #D7DDD8}
.bill .due{margin-top:10%;font-size:clamp(9px,.8vw,11px);color:#6B7A73}
.bill .amt{font-size:clamp(20px,2.2vw,30px);font-weight:700;position:relative;display:inline-block}
.bill .amt::after{content:"";position:absolute;left:-4%;top:52%;height:3px;width:0;background:var(--coral);transition:width .5s cubic-bezier(.22,1,.36,1) .1s}
.bill.struck .amt::after{width:108%}
.stamp{position:absolute;right:-14%;bottom:8%;width:44%;aspect-ratio:1;border-radius:50%;border:5px solid var(--coral);display:grid;place-items:center;text-align:center;color:var(--coral);background:rgba(255,255,255,.82);transform:rotate(14deg);opacity:0;font-family:Anton,sans-serif;line-height:.95}
.stamp b{font-weight:400;font-size:clamp(28px,3vw,44px);display:block}.stamp span{font-size:clamp(12px,1.1vw,16px);letter-spacing:.06em}
.side{position:absolute;z-index:4;bottom:7vh;font-family:Anton,sans-serif;font-size:clamp(14px,1.3vw,18px);line-height:1.25;color:var(--ink);letter-spacing:.02em}
.side.l{left:max(5vw,16px)}.side.r{right:calc(max(5vw,16px) + 190px);text-align:right;bottom:4vh}
.cta{position:absolute;z-index:6;right:max(5vw,16px);bottom:5vh;width:clamp(130px,12vw,170px);aspect-ratio:1;border-radius:50%;border:0;background:var(--coral);color:var(--oncoral);font-family:Anton,sans-serif;font-size:clamp(20px,1.8vw,26px);line-height:1.02;letter-spacing:.02em;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.cta:hover{transform:scale(1.06) rotate(-4deg)}
.app{position:absolute;inset:80px 0 0;z-index:7;display:none;justify-content:center;padding:2vh 16px 40px}
.panel{width:min(560px,100%);background:var(--card);border-radius:22px;padding:28px clamp(18px,4vw,36px) 30px;box-shadow:0 30px 60px -30px rgba(14,59,46,.5);border:1px solid var(--line);align-self:flex-start}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.steps i.on::after{transform:scaleX(1)}
h2{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(32px,5vw,44px);line-height:1.05;margin:0 0 6px;letter-spacing:.01em}
.sub{color:var(--ink2);margin:0 0 20px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--ink);background:color-mix(in srgb,var(--mint) 30%,transparent)}
.drop label{display:inline-block;margin-top:10px}
.btn{border:0;border-radius:999px;padding:13px 24px;min-height:48px;background:var(--ink);color:var(--card);font-weight:500}
.btn.coral{background:var(--coral);color:var(--oncoral)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);opacity:0}
.field .k{font-size:14px;color:var(--ink2)}.field .v{font-weight:500;grid-column:1}
.conf{grid-row:1/3;grid-column:2;font-size:13px;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--mint) 70%,transparent);color:var(--ink);white-space:nowrap}
.field.check{border:1.5px solid var(--coral);border-radius:12px;padding:12px;margin:8px -12px;background:var(--coralbg)}
.field.check .conf{background:var(--coral);color:var(--oncoral)}
.field input{font:inherit;font-weight:500;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);color:var(--ink);width:100%;min-height:40px}
.status{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:15px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--coral);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}
.q{margin:18px 0}
.q label{display:block;font-weight:500;margin-bottom:8px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}
.stepper button{width:48px;height:48px;border:0;background:none;color:var(--ink);font-size:22px}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:20px}
.money{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;max-width:280px}
.money span{color:var(--ink2)}.money input{font:inherit;font-size:20px;font-weight:700;border:0;background:none;color:var(--ink);padding:12px 6px;width:100%}
.verdict{display:flex;gap:30px;align-items:center;margin-bottom:6px}
.mini{position:relative;width:96px;flex:none;aspect-ratio:.78;background:#fff;border-radius:5px;transform:rotate(-6deg);box-shadow:0 12px 24px -12px rgba(14,59,46,.5);padding:10px;font:10px ui-monospace,monospace;color:#5B6B65}
.mini .stamp{width:62%;right:-8%;bottom:4%;border-width:3px}.mini .stamp b{font-size:20px}.mini .stamp span{font-size:9px}
.quote{font-size:16px;line-height:1.6;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--mint) 35%,transparent);margin:16px 0}
.hl{background:linear-gradient(var(--coralbg),var(--coralbg)) no-repeat 0 0/0% 100%;transition:background-size 1.1s cubic-bezier(.22,1,.36,1) .5s;padding:1px 2px;border-radius:3px}
.hl.on{background-size:100% 100%}
.fine{font-size:13px;color:var(--ink2);margin-top:14px}
@media(max-width:700px){nav .links{display:none}.hero{min-height:640px}h1 .l2{padding-left:0}.bill-wrap{top:56%;left:50%;width:58vw;transform:translate(-50%,-50%)}.side.r{display:none}.side.l{bottom:6vh;max-width:45vw}.cta{width:120px;font-size:19px}}
@media(prefers-reduced-motion:reduce){.cloud,.scrap{animation:none!important}*{transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
 <div class="sky" id="sky" aria-hidden="true"></div>
 <nav><div class="logo">BILLBACK</div><div class="links"><a href="#how">How it works</a><a href="#es">Español</a></div></nav>
 <section class="hero" id="hero">
  <h1><span class="l1">YOU MAY NOT</span><span class="l2">OWE THIS BILL</span></h1>
  <div class="bill-wrap" id="billWrap" aria-hidden="true">
   <div class="bill" id="bill">
    <svg class="creases" viewBox="0 0 100 128" preserveAspectRatio="none"><path d="M0 40 L45 52 L100 34" stroke="#C9D2CC" stroke-width=".5" fill="none" opacity=".7"/><path d="M30 0 L38 60 L26 128" stroke="#C9D2CC" stroke-width=".4" fill="none" opacity=".5"/><path d="M0 92 L60 84 L100 98" stroke="#C9D2CC" stroke-width=".5" fill="none" opacity=".6"/><path d="M45 52 L100 34 L100 0 L70 0Z" fill="#0E3B2E" opacity=".035"/><path d="M0 92 L60 84 L100 98 L100 128 L0 128Z" fill="#0E3B2E" opacity=".03"/></svg>
    <div class="h">MERCY GENERAL HOSPITAL</div>
    <div class="s">Patient statement · Acct 88-20417</div>
    <div class="row"><span>Emergency visit</span><span>$2,940</span></div>
    <div class="row"><span>Imaging</span><span>$1,215</span></div>
    <div class="row"><span>Lab services</span><span>$657</span></div>
    <div class="due">AMOUNT DUE</div>
    <div class="amt">$4,812.00</div>
   </div>
   <div class="stamp" id="stamp"><div><b>$0</b><span>OWED</span></div></div>
  </div>
  <div class="side l">FREE CARE IS THE LAW<br>AT NONPROFIT HOSPITALS</div>
  <div class="side r">$2.7B BILLED TO PATIENTS<br>WHO LIKELY QUALIFIED</div>
  <button class="cta" id="cta">CHECK<br>MY BILL</button>
 </section>
 <section class="app" id="app" aria-live="polite"><div class="panel" id="panel"></div></section>
</div>
<script>
{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
function springEase(k=180,c=12,m=1){let x=0,v=0,dt=1/240,out=[],last=0;for(let i=0;i<960;i++){const a=(-k*(x-1)-c*v)/m;v+=a*dt;x+=v*dt;out.push(x);if(Math.abs(x-1)>.002||Math.abs(v)>.01)last=i}const n=last+1,pts=[];for(let i=0;i<=40;i++)pts.push(out[Math.min(n-1,Math.round(i*(n-1)/40))].toFixed(3));pts[0]='0';pts[40]='1';return{easing:`linear(${pts.join(',')})`,duration:Math.round(n*dt*1000)}}
const SP=springEase(),SOFT=springEase(120,16);
let springOK=true;try{document.body.animate([{opacity:1},{opacity:1}],{duration:1,easing:SP.easing})}catch(e){springOK=false}
function go(el,kf,o={}){if(!el)return Promise.resolve();const opt={duration:o.duration||700,delay:o.delay||0,easing:o.easing||'cubic-bezier(.22,1,.36,1)',fill:'both'};
 if(o.spring){const s=o.spring===2?SOFT:SP;opt.easing=springOK?s.easing:'cubic-bezier(.34,1.56,.64,1)';opt.duration=o.duration||s.duration}
 if(reduce){opt.duration=1;opt.delay=0}return el.animate(kf,opt).finished}
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
const sky=$('#sky');
const clouds=[[6,14,220,70,48,0],[62,8,300,90,70,1],[78,40,180,56,40,2],[-4,58,260,80,60,1],[40,70,200,60,52,0],[86,78,240,74,64,2]];
sky.innerHTML=clouds.map(([x,y,w,h,s,d])=>`<div class="cloud" data-d="${d}" style="left:${x}%;top:${y}%;width:${w}px;height:${h}px;animation:drift ${s}s ease-in-out ${-s/3}s infinite alternate"></div>`).join('')+
 [[28,52,110,'$4,8',-14,26],[44,62,86,'DUE',10,31],[88,18,70,'12.00',-6,23],[12,80,64,'ACCT',18,29],[58,86,74,'$657',-20,35],[92,58,58,'88-2',8,27]].map(([x,y,w,t,r,sp],i)=>{
  const pts=[];const rnd=k=>((Math.sin(i*97+k*13.7)+1)/2);
  for(let k=0;k<=8;k++)pts.push(`${k*12.5},${6+rnd(k)*10}`);
  for(let k=0;k<=5;k++)pts.push(`${92+rnd(k+20)*8},${16+k*9}`);
  for(let k=8;k>=0;k--)pts.push(`${k*12.5},${58+rnd(k+40)*10}`);
  for(let k=5;k>=0;k--)pts.push(`${rnd(k+60)*8},${16+k*9}`);
  return `<div class="scrap" data-d="${i%3}" style="left:${x}%;top:${y}%;width:${w}px;--r:${r}deg;animation:tumble ${sp}s ease-in-out ${-sp*rnd(5)}s infinite alternate"><svg viewBox="0 0 100 76"><polygon points="${pts.join(' ')}" fill="#FFFFFF"/><polygon points="${pts.join(' ')}" fill="#0E3B2E" opacity=".04" transform="translate(0 4) scale(1 .5)"/><line x1="10" y1="${44+rnd(3)*6}" x2="${50+rnd(4)*30}" y2="${44+rnd(3)*6}" stroke="#D7DDD8" stroke-width="2" stroke-dasharray="3 3"/><text x="12" y="36" font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="700" fill="#2B3A34">${t}</text></svg></div>`}).join('');
const BT='translate(-50%,-50%)';
const layers=[...document.querySelectorAll('[data-d]')],bw=$('#billWrap');
if(!reduce){addEventListener('pointermove',e=>{const dx=e.clientX/innerWidth-.5,dy=e.clientY/innerHeight-.5;layers.forEach(l=>{const d=(+l.dataset.d+1)*8;l.style.translate=`${-dx*d}px ${-dy*d}px`});bw.style.translate=`${dx*14}px ${dy*10}px`})}
let bob;
async function intro(){
 go($('h1 .l1'),[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],{duration:900});
 go($('h1 .l2'),[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],{duration:900,delay:120});
 go(document.querySelector('.side.l'),[{opacity:0},{opacity:1}],{delay:500});go(document.querySelector('.side.r'),[{opacity:0},{opacity:1}],{delay:600});
 go($('#cta'),[{transform:'scale(0)'},{transform:'scale(1)'}],{spring:1,delay:700});
 await go(bw,[{opacity:0,transform:'translate(-10%,-30%) rotate(18deg) scale(.8)'},{opacity:1,transform:BT+' rotate(0) scale(1)'}],{spring:2,delay:250});
 await wait(250);
 await go($('#stamp'),[{opacity:0,transform:'rotate(30deg) scale(2.4)'},{opacity:1,transform:'rotate(14deg) scale(1)'}],{spring:1});
 go($('#bill'),[{transform:'rotate(-8deg) translateY(0)'},{transform:'rotate(-8deg) translateY(6px)'},{transform:'rotate(-8deg) translateY(0)'}],{duration:220});
 $('#bill').classList.add('struck');
 if(!reduce)bob=bw.animate([{marginTop:'0px'},{marginTop:'-14px'}],{duration:3200,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});
}
intro();
const panel=$('#panel'),app=$('#app');
const bar=n=>`<div class="steps" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
async function swap(html){await go(panel,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-14px)'}],{duration:220});panel.innerHTML=html;await go(panel,[{opacity:0,transform:'translateY(22px)'},{opacity:1,transform:'none'}],{spring:2});panel.querySelector('h2')?.focus()}
$('#cta').addEventListener('click',async()=>{
 bob?.cancel();
 go($('h1'),[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-60px)'}],{duration:600});
 document.querySelectorAll('.side,.cta').forEach(el=>go(el,[{opacity:1},{opacity:0,transform:'scale(.9)'}],{duration:350}));
 await go(bw,[{transform:getComputedStyle(bw).transform,opacity:1},{transform:'translate(-50%,10%) scale(.35) rotate(-4deg)',opacity:0}],{duration:650,easing:'cubic-bezier(.6,0,.3,1)'});
 $('#hero').style.visibility='hidden';app.style.display='flex';
 panel.innerHTML=upload();go(panel,[{opacity:0,transform:'translateY(60px) scale(.97)'},{opacity:1,transform:'none'}],{spring:2});wireUpload();
});
function upload(){return `${bar(1)}<h2 tabindex="-1">Add your bill</h2><p class="sub">A photo or PDF works. It stays on this page and is never stored.</p>
 <div class="drop" id="drop"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
 <div style="font-weight:500;margin-top:6px">Drop your bill here</div><label class="btn ghost" for="file">Choose a file</label><input id="file" type="file" accept="image/*,.pdf" hidden></div>
 <div class="row2"><button class="btn coral" id="sample">Try a sample bill</button><button class="btn ghost" id="manual">Type it in instead</button></div>`}
function wireUpload(){const d=$('#drop');['dragover','dragenter'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.add('over')}));d.addEventListener('dragleave',()=>d.classList.remove('over'));d.addEventListener('drop',e=>{e.preventDefault();reading()});$('#file').addEventListener('change',reading);$('#sample').addEventListener('click',reading);$('#manual').addEventListener('click',reading)}
const F=[['Hospital','Mercy General Hospital',.97],['Hospital address','1400 Riverside Ave, Mobile, AL',.95],['Amount due','$4,812.00',.99],['Service date','Aug 14, 2026',.93],['Account number','88-20417',.71]];
async function reading(){
 await swap(`${bar(2)}<h2 tabindex="-1">Reading your bill</h2><div class="status" id="st"><span class="dot"></span><span>Looking for the details that matter…</span></div><div id="fields">${F.map(([k,v,c])=>`<div class="field${c<.8?' check':''}"><span class="k">${k}${c<.8?' · please check this one':''}</span>${c<.8?`<input value="${v}" aria-label="${k}">`:`<span class="v">${v}</span>`}<span class="conf">${Math.round(c*100)}% sure</span></div>`).join('')}</div><div class="row2" id="next" style="opacity:0"><button class="btn" id="ok">Looks right</button></div>`);
 const rows=[...document.querySelectorAll('.field')];
 for(const r of rows){await wait(420);go(r,[{opacity:0,transform:'translateX(-16px)'},{opacity:1,transform:'none'}],{spring:2})}
 await wait(450);$('#st').innerHTML='<span>Done in 2.6 seconds. One detail needs your eyes.</span>';
 go($('#next'),[{opacity:0},{opacity:1}]);$('#ok').addEventListener('click',questions);
}
async function questions(){
 await swap(`${bar(3)}<h2 tabindex="-1">Two quick questions</h2><p class="sub">Hospitals decide using household size and yearly income.</p>
 <div class="q"><label id="hl">People in your household</label><div class="stepper" role="group" aria-labelledby="hl"><button id="m" aria-label="Fewer people">−</button><output id="n">3</output><button id="p" aria-label="More people">+</button></div></div>
 <div class="q"><label for="inc">Yearly household income, before taxes</label><div class="money"><span>$</span><input id="inc" inputmode="numeric" value="41,000"></div></div>
 <div class="row2"><button class="btn coral" id="see">See my result</button></div>`);
 let n=3;const o=$('#n'),bump=()=>go(o,[{transform:'scale(1.4)'},{transform:'scale(1)'}],{spring:1});
 $('#m').onclick=()=>{n=Math.max(1,n-1);o.textContent=n;bump()};$('#p').onclick=()=>{n=Math.min(12,n+1);o.textContent=n;bump()};
 $('#see').onclick=()=>result(n,+($('#inc').value.replace(/\D/g,''))||0);
}
async function result(n,inc){
 const line=15650+5500*(n-1),pct=Math.round(inc/line*100),free=pct<=200,disc=!free&&pct<=400;
 const word=free?'Likely free care':disc?'Likely a discount':'Probably not eligible';
 await swap(`${bar(4)}<div class="verdict"><div class="mini" aria-hidden="true">MERCY GENERAL<br><br>DUE<br><s>$4,812.00</s><div class="stamp" id="ms"><div><b>${free?'$0':disc?'−%':'?'}</b><span>${free?'OWED':disc?'OFF':'CHECK'}</span></div></div></div>
